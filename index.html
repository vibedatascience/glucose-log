<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>Glucose Log</title>
<style>
  :root { --red:#E60023; --navy:#0a3069; --slate:#64748b; --line:#e2e8f0; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,-apple-system,sans-serif; margin:0; background:#f8fafc; color:#0f172a; }
  .wrap { max-width:560px; margin:0 auto; padding:16px; }
  h1 { font-size:20px; margin:0; }
  .sub { font-size:13px; color:var(--slate); margin:4px 0 14px; }
  .card { background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
  .mealhead { display:flex; justify-content:space-between; align-items:center; }
  .mealhead strong { font-size:16px; }
  .row { display:flex; align-items:center; gap:8px; margin-top:10px; flex-wrap:wrap; }
  .lbl { font-size:13px; color:var(--slate); width:105px; flex-shrink:0; }
  input[type=time], input[type=number], input[type=text], input[type=date], input[type=password] {
    border:1px solid #cbd5e1; border-radius:8px; padding:8px; font-size:15px; }
  input[type=number] { width:80px; font-size:18px; font-weight:700; }
  input[type=text] { flex:1; min-width:150px; }
  button { border:none; border-radius:8px; padding:8px 14px; font-size:14px; cursor:pointer; }
  .now { background:var(--navy); color:#fff; }
  .save { background:var(--red); color:#fff; width:100%; padding:14px; font-size:16px; font-weight:700; margin-top:4px; }
  .save:disabled { background:#fca5a5; }
  .badge { padding:2px 10px; border-radius:12px; font-size:13px; font-weight:600; }
  .ok { background:#dcfce7; color:#166534; }
  .bad { background:#fee2e2; color:#991b1b; }
  .prick { font-size:12px; color:var(--red); font-weight:600; }
  .status { font-size:13px; color:var(--slate); text-align:center; margin:8px 0; min-height:18px; }
  table { border-collapse:collapse; width:100%; font-size:13px; background:#fff; border-radius:12px; overflow:hidden; border:1px solid var(--line); }
  th, td { padding:7px 8px; text-align:left; border-bottom:1px solid #f1f5f9; }
  th { color:var(--slate); font-weight:600; background:#f8fafc; }
  .g { color:#166534; font-weight:600; } .r { color:var(--red); font-weight:600; } .e { color:#cbd5e1; }
  .daynav { display:flex; gap:8px; margin-bottom:14px; align-items:center; }
  .daybtn { border:1px solid #cbd5e1; background:#fff; }
  .daybtn.active { background:var(--navy); color:#fff; border-color:var(--navy); }
  #setup { background:#fff7ed; border:1px solid #fdba74; }
  #setup p { font-size:13px; margin:6px 0; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Glucose Log</h1>
  <div class="sub">Targets: fasting &lt;95, 1hr after meals &lt;140</div>

  <div class="card" id="setup" style="display:none">
    <strong>One-time setup</strong>
    <p>Paste a GitHub token that can access vibedatascience/glucose-log. It is stored only on this phone.</p>
    <div class="row">
      <input type="password" id="tok" placeholder="github_pat_..." style="flex:1">
      <button class="now" onclick="saveTok()">Save</button>
    </div>
  </div>

  <div class="daynav">
    <button class="daybtn" id="ybtn" onclick="shiftDay(-1)">Yesterday</button>
    <button class="daybtn active" id="tbtn" onclick="shiftDay(0)">Today</button>
    <input type="date" id="datepick" onchange="pickDate(this.value)">
  </div>

  <div id="meals"></div>

  <button class="save" id="savebtn" onclick="push()">Save to log</button>
  <div class="status" id="status"></div>

  <h1 style="font-size:16px; margin-top:20px">Last 7 days</h1>
  <div style="overflow-x:auto; margin-top:8px"><table id="hist"></table></div>
</div>

<script>
const REPO = "vibedatascience/glucose-log";
const MEALS = ["Fasting","Breakfast","Lunch","Dinner"];
const TARGET = {Fasting:95, Breakfast:140, Lunch:140, Dinner:140};
let date = todayStr(0);
let month = {};
let sha = null;
let dirty = false;

function todayStr(off){ const d=new Date(); d.setDate(d.getDate()+off); return d.toLocaleDateString('en-CA'); }
function nowT(){ return new Date().toTimeString().slice(0,5); }
function addHr(t){ if(!t) return ""; const p=t.split(":").map(Number); const d=new Date(); d.setHours(p[0]+1,p[1],0); return d.toTimeString().slice(0,5); }
function fileFor(dt){ return "data/" + dt.slice(0,7) + ".json"; }
function tok(){ return localStorage.getItem("glog_token") || ""; }
function saveTok(){ const v=document.getElementById("tok").value.trim(); if(v){ localStorage.setItem("glog_token", v); document.getElementById("setup").style.display="none"; load(); } }
function hdrs(){ return { "Authorization":"Bearer "+tok(), "Accept":"application/vnd.github+json" }; }
function b64enc(s){ return btoa(unescape(encodeURIComponent(s))); }
function b64dec(s){ return decodeURIComponent(escape(atob(s.replace(/\n/g,"")))); }

async function load(){
  if(!tok()){ document.getElementById("setup").style.display="block"; render(); return; }
  setStatus("loading...");
  try{
    const r = await fetch("https://api.github.com/repos/"+REPO+"/contents/"+fileFor(date)+"?t="+Date.now(), {headers:hdrs()});
    if(r.status===404){ month={}; sha=null; }
    else if(!r.ok){ throw new Error("HTTP "+r.status); }
    else{ const j = await r.json(); sha=j.sha; month=JSON.parse(b64dec(j.content)); }
    setStatus("");
  }catch(e){ setStatus("load failed: "+e.message); month={}; sha=null; }
  render(); renderHist();
}

function entry(meal){ if(!month[date]) month[date]={}; if(!month[date][meal]) month[date][meal]={}; return month[date][meal]; }
function val(meal,f){ return (month[date]&&month[date][meal]&&month[date][meal][f])||""; }
function set(meal,f,v){ entry(meal)[f]=v; dirty=true; render(); }

function badge(meal){
  const r = parseInt(val(meal,"reading"));
  if(isNaN(r)) return "";
  return r < TARGET[meal] ? '<span class="badge ok">in range</span>' : '<span class="badge bad">over '+TARGET[meal]+'</span>';
}

function render(){
  document.getElementById("datepick").value = date;
  document.getElementById("ybtn").className = "daybtn"+(date===todayStr(-1)?" active":"");
  document.getElementById("tbtn").className = "daybtn"+(date===todayStr(0)?" active":"");
  let h = "";
  for(const meal of MEALS){
    const fast = meal==="Fasting";
    const eat = val(meal,"eatTime");
    h += '<div class="card"><div class="mealhead"><strong>'+meal+'</strong>'+badge(meal)+'</div>';
    if(!fast){
      h += '<div class="row"><span class="lbl">Started eating</span>'
        +'<input type="time" value="'+eat+'" onchange="set(\''+meal+'\',\'eatTime\',this.value)">'
        +'<button class="now" onclick="set(\''+meal+'\',\'eatTime\',nowT())">Now</button>'
        +(eat?'<span class="prick">prick at '+addHr(eat)+'</span>':'')+'</div>';
    }
    h += '<div class="row"><span class="lbl">Reading mg/dL</span>'
      +'<input type="number" inputmode="numeric" value="'+val(meal,'reading')+'" onchange="set(\''+meal+'\',\'reading\',this.value)">'
      +'<input type="time" value="'+val(meal,'readTime')+'" onchange="set(\''+meal+'\',\'readTime\',this.value)">'
      +'<button class="now" onclick="set(\''+meal+'\',\'readTime\',nowT())">Now</button></div>';
    if(!fast){
      h += '<div class="row"><span class="lbl">What she ate</span>'
        +'<input type="text" placeholder="e.g. 1 roti, dal, curd" value="'+String(val(meal,'food')).replace(/"/g,'&quot;')+'" onchange="set(\''+meal+'\',\'food\',this.value)"></div>';
    }
    h += '</div>';
  }
  document.getElementById("meals").innerHTML = h;
}

async function push(){
  if(!tok()){ document.getElementById("setup").style.display="block"; return; }
  const btn=document.getElementById("savebtn"); btn.disabled=true; setStatus("saving...");
  const body = { message:"glucose "+date, content:b64enc(JSON.stringify(month,null,2)) };
  if(sha) body.sha = sha;
  try{
    const r = await fetch("https://api.github.com/repos/"+REPO+"/contents/"+fileFor(date),
      {method:"PUT", headers:Object.assign({},hdrs(),{"Content-Type":"application/json"}), body:JSON.stringify(body)});
    if(r.status===409 || r.status===422){ setStatus("conflict, reloading latest, re-enter last change"); await load(); }
    else if(!r.ok){ const j=await r.json(); throw new Error(j.message||("HTTP "+r.status)); }
    else{ const j=await r.json(); sha=j.content.sha; dirty=false; setStatus("saved at "+new Date().toLocaleTimeString()); renderHist(); }
  }catch(e){ setStatus("save failed: "+e.message); }
  btn.disabled=false;
}

function shiftDay(off){ maybeWarn(function(){ date=todayStr(off); load(); }); }
function pickDate(v){ maybeWarn(function(){ date=v; load(); }); }
function maybeWarn(fn){ if(dirty && !confirm("Unsaved changes on this day. Discard?")) return; dirty=false; fn(); }
function setStatus(s){ document.getElementById("status").textContent=s; }

async function renderHist(){
  const days=[]; for(let i=6;i>=0;i--) days.push(todayStr(-i));
  const months=Array.from(new Set(days.map(function(d){return d.slice(0,7);})));
  const all={};
  for(const m of months){
    try{
      const r=await fetch("https://api.github.com/repos/"+REPO+"/contents/data/"+m+".json?t="+Date.now(),{headers:hdrs()});
      if(r.ok){ const j=await r.json(); Object.assign(all, JSON.parse(b64dec(j.content))); }
    }catch(e){}
  }
  let h="<tr><th>Date</th>"+MEALS.map(function(m){return "<th>"+m+"</th>";}).join("")+"</tr>";
  for(const d of days.reverse()){
    h+="<tr><td>"+d.slice(5)+"</td>";
    for(const m of MEALS){
      const rec=all[d]&&all[d][m]; const r=rec&&parseInt(rec.reading);
      if(!r||isNaN(r)) h+='<td class="e">-</td>';
      else h+='<td class="'+(r<TARGET[m]?'g':'r')+'">'+r+"</td>";
    }
    h+="</tr>";
  }
  document.getElementById("hist").innerHTML=h;
}

load();
</script>
</body>
</html>
